name: Build APK

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

# Necessario para o job publicar o Release com o APK anexado.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: apk-teste

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # O plugin google-services falha o build sem este arquivo.
      #
      # Ordem de prioridade:
      #  1. segredo GOOGLE_SERVICES_JSON, se cadastrado — permite apontar para
      #     outro projeto Firebase sem mexer no repositório;
      #  2. app/google-services.json versionado — é o caso normal hoje. Este
      #     arquivo NÃO é segredo: ele vai dentro de todo APK e qualquer um
      #     consegue extrair. A segurança vem das regras do Firestore;
      #  3. placeholder — só para o build passar num fork sem Firebase nenhum.
      #     O APK instala e abre, mas não autentica nem sinaliza.
      - name: Preparar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "::notice::Usando google-services.json do segredo do repositório."
          elif [ -s app/google-services.json ]; then
            echo "::notice::Usando o app/google-services.json versionado."
          else
            cp .github/google-services.placeholder.json app/google-services.json
            echo "::warning::Sem google-services.json real. APK gerado com Firebase de mentira: instala e abre, mas não faz chamada."
          fi

          # Falha cedo e com mensagem clara se o pacote não bater — o sintoma
          # sem esta checagem é o app compilar e falhar em silêncio no login.
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("app/google-services.json"))
          alvo = "com.portaretrato.chamadas"
          pkgs = [c["client_info"]["android_client_info"]["package_name"] for c in d["client"]]
          if alvo not in pkgs:
              print(f"::error::google-services.json nao contem {alvo}. Tem: {pkgs}")
              sys.exit(1)
          print(f"::notice::projeto {d['project_info']['project_id']}, pacote {alvo} presente.")
          EOF

      - name: Build debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Preparar o APK para download
        id: apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/porta-retrato.apk
          echo "sha256=$(sha256sum dist/porta-retrato.apk | cut -d" " -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h dist/porta-retrato.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: porta-retrato-apk
          path: dist/porta-retrato.apk
          if-no-files-found: error
          retention-days: 30

      # Release com tag fixa: o link para download NAO muda entre builds, entao
      # da para mandar o mesmo endereco por WhatsApp e ele sempre aponta para a
      # versao mais recente. Diferente do artefato do Actions, o arquivo de um
      # Release baixa sem login — que e o que permite instalar direto no celular.
      - name: Publicar Release para instalacao no celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<'EOM'
          APK de teste do Porta Retrato, para instalar direto no celular.

          **Como instalar:** abra este link no navegador do celular, toque em
          `porta-retrato.apk`, e confirme. Se o Android avisar sobre "app de
          fonte desconhecida", toque em Configuracoes e permita a instalacao
          para o navegador que voce esta usando.

          Requisitos: Android 8.0 ou superior.

          **O que este APK faz hoje:** abre, mostra as telas, pede as
          permissoes e a tela de privacidade da camera funciona. Ele foi
          compilado com um `google-services.json` de placeholder, entao **NAO
          autentica e NAO faz chamada** — na tela inicial aparece "Falha ao
          entrar". Isso e esperado, nao e defeito. Para o APK funcional, e
          preciso cadastrar o segredo GOOGLE_SERVICES_JSON no repositorio.

          Este app instala LADO A LADO com o Porta Retrato ja existente
          (applicationId diferente), sem substituir nada.
          EOM
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/porta-retrato.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/porta-retrato.apk \
              --title "Porta Retrato — APK de teste" \
              --notes "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          echo "### APK publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Baixe em: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/porta-retrato.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: ${{ steps.apk.outputs.sha256 }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatórios em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-build
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
